name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.extras }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # core only needs neither framework; each backend's tests skip themselves
        # when it is missing, and the parity tests need both.
        extras: ["tf", "torch", "tf,torch"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pypress with the ${{ matrix.extras }} extra(s)
        # CPU-only torch wheels: the default Linux (CUDA) wheels pull in triton,
        # whose native library aborts the process when loaded after TensorFlow
        # (torch.optim imports it lazily via torch._dynamo).
        run: >-
          pip install -e ".[${{ matrix.extras }}]" pytest
          --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: python -m pytest pypress/tests/ -v -rs

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1
